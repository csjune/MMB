[package]
name = "mmb"
version = "0.1.13"
edition = "2024"
build = "build.rs"
description = "Multi Monitor Brightness"
license = "MIT"

[dependencies]
monbcon = "0.2"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "unstable-winit-030",
    "system-tray",
    "compat-1-2",
] }
# Not used directly: Slint decodes images with this crate, and enabling only
# the ICO decoder here lets it load the embedded icons without pulling in
# every format that Slint's `image-default-formats` would add.
image = { version = "0.25", default-features = false, features = ["ico"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1.31"

[profile.release]
lto = true
codegen-units = 1
strip = true
